<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Répertoire public MEYDEN</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#fff3e8;font:16px/1.5 system-ui,sans-serif}header{background:#0c131c;padding:18px 5%;border-bottom:1px solid #a45425}a{color:inherit;text-decoration:none}strong{font-size:25px;letter-spacing:2px}strong b{color:#ff791d}main{max-width:1150px;margin:auto;padding:30px 18px}h1{text-transform:uppercase;font-size:clamp(32px,6vw,60px)}p{color:#c6b6ad}input{width:100%;padding:14px;background:#111923;border:1px solid #b45728;color:white;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:17px;margin:25px 0}.card{background:linear-gradient(130deg,#21160f,#10151c);border:1px solid #a25124;border-radius:13px;padding:18px;overflow:hidden}.card img{width:100%;height:210px;object-fit:cover;border-radius:8px}.card h2{font-size:22px}.button{display:inline-block;background:#ff791d;padding:11px 15px;color:#160e08;border-radius:7px;font-weight:800}.secondary{background:#161b24;color:#ffb88c;border:1px solid #a25124}body{background:radial-gradient(ellipse at 50% 0,#31190c,#0b0e14 58%)}header{box-shadow:0 8px 28px #000b;border-bottom:2px solid #f47a27}main>p:first-child{letter-spacing:2px;color:#ee8f49;font-size:12px;font-weight:800}h1{line-height:1.05;margin:14px 0 20px}.grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{padding:12px;display:grid;grid-template-columns:1fr;align-content:start;gap:7px;box-shadow:0 15px 30px #0008}.card img{width:100%;height:165px;object-fit:cover;object-position:center 25%;border:1px solid #87441e}.card h2{font-size:20px;line-height:1.15;margin:5px 0}.card p{font-size:14px;line-height:1.4;margin:0 0 6px}.card .button{justify-self:start;padding:9px 13px;font-size:14px}@media(max-width:650px){main{padding:20px 14px}.grid{grid-template-columns:1fr}.card{grid-template-columns:108px minmax(0,1fr);gap:7px 13px;align-items:start;min-height:145px}.card img{grid-row:1 / span 3;width:108px;height:125px}.card h2{font-size:17px;margin:1px 0}.card p{font-size:12px;line-height:1.3}.card .button{font-size:12px;padding:8px 10px}.card:not(:has(img)){grid-template-columns:1fr}.card:not(:has(img)) h2{font-size:20px}h1{font-size:37px}input{font-size:15px}}</style></head><body><header><a href="/"><strong>MEYDEN <b>OS</b></strong></a></header><main><p>QUARTIER ARTISTIQUE · RÉPERTOIRE PUBLIC</p><h1>Les profils MEYDEN</h1><p>Découvre les artistes, producteurs et créateurs qui choisissent de publier leur profil.</p><input id="filter" type="search" placeholder="Rechercher un nom ou une expertise"><div id="cards" class="grid"></div><a class="button secondary" href="/profils/?profil=nouveau">Créer mon profil</a> <a class="button secondary" href="/">Retour au quartier</a></main><script type="module">import {db} from '../../shared/sync.js';let profiles=[];const cards=document.getElementById('cards');function render(){const q=document.getElementById('filter').value.toLowerCase();const list=profiles.filter(p=>(p.display_name+' '+p.headline+' '+p.specialty).toLowerCase().includes(q));cards.replaceChildren();for(const p of list){const el=document.createElement('article');el.className='card';if(p.photo_url){const img=document.createElement('img');img.src=p.photo_url;img.alt='Portrait de '+p.display_name;el.append(img)}const h=document.createElement('h2');h.textContent=p.display_name;const sub=document.createElement('p');sub.textContent=p.headline;const link=document.createElement('a');link.className='button';link.href='/profils/?profil='+encodeURIComponent(p.slug);link.textContent='Voir le profil →';el.append(h,sub,link);cards.append(el)}if(!list.length)cards.textContent='Aucun profil public trouvé.'}async function run(){const r=await db().from('meyden_public_profiles').select('slug,display_name,headline,specialty,photo_url').eq('published',true).order('display_name');if(r.error){cards.textContent='Répertoire temporairement indisponible';return}profiles=r.data||[];render()}document.getElementById('filter').oninput=render;run();</script></body></html>
