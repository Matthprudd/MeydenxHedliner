<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEYDEN — Profils artistes</title><link rel="stylesheet" href="../../shared/style.css"></head><body><header><a href="/"><strong>MEYDEN OS</strong></a><nav><a href="/">Quartier</a><a href="/modules/meyden-calendrier-booking/">Calendrier</a><a href="/modules/meyden-dossier-client/">Mon dossier</a></nav></header><main><span class="pill">Répertoire privé MEYDEN</span><h1>Artistes</h1><p>Une fiche unique pour relier l’artiste, les demandes de booking et les dossiers MEYDEN. Aucun profil Hedliner n’est modifié.</p><div id="entry"></div><section id="working" hidden><div class="card"><label>Rechercher un artiste<input type="search" id="search" placeholder="Nom, ville, style"></label><div id="artists"></div></div><div id="staffArea" class="card" hidden><h2 id="editTitle">Ajouter un artiste</h2><form id="form"><label>Nom artistique<input name="stage_name" required></label><label>Style musical<input name="style"></label><label>Ville<input name="city"></label><label>Présentation<textarea name="description"></textarea></label><label>Lien profil Hedliner (facultatif)<input type="url" name="hedliner_url" placeholder="https://hedliner.com/..."></label><label>Lien vidéo<input name="video_url" type="url" placeholder="https://youtu.be/..."></label><label>État<select name="status"><option value="draft">Brouillon</option><option value="active">Actif</option><option value="paused">En pause</option></select></label><div class="actions"><button type="submit">Enregistrer la fiche</button><button type="button" class="ghost" id="cancelEdit">Annuler</button></div></form></div></section><p class="status" id="notice" role="status"></p></main><footer>Fiches synchronisées exclusivement dans MEYDEN</footer><script type="module" src="./page.js"></script></body></html>
